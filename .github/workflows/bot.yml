name: crt-bot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crt-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Botu bir tur calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          OANDA_ENV: practice
          CRYPTO_SOURCE: okx
          LATE_MIN: "30"
        run: python bot.py --once
      - name: Durumu kaydet
        run: |
          git config user.name "crt-bot"
          git config user.email "crt-bot@users.noreply.github.com"
          git add state.json settings.json
          if ! git diff --cached --quiet; then
            git commit -m "durum [skip ci]"
            git pull --rebase -q
            git push -q
          fi
